# Der komplette Stack: Postgres + App (API + gebautes Frontend in einem Image).
# `docker compose up -d --build` starten, UI auf http://127.0.0.1:8010.
#
# Fürs Entwickeln mit Hot Reload läuft nur die DB im Container:
#   docker compose up -d db
#   cd backend && uv run uvicorn app.main:app --reload
#   cd frontend && npm run dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smierx_queue
      POSTGRES_PASSWORD: smierx_queue
      POSTGRES_DB: smierx_queue
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smierx_queue"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://smierx_queue:smierx_queue@db:5432/smierx_queue
      # Die App rechnet mit lokaler Zeit ("heute", Tagesfenster), Container-Default wäre UTC.
      TZ: Europe/Berlin
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
