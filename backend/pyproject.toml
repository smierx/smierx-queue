[project]
name = "smierx-queue-backend"
version = "0.1.0"
description = "Queue-Taskmanagement: API für Tasks mit Tag-System, Termine/Blocker und Arbeitszeit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.8",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]  # Fehler, Pyflakes, Import-Sortierung
