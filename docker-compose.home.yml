# Homeserver-Variante: nutzt die zentrale Postgres im Netz `db-internal`
# statt eines eigenen db-Containers (Backup läuft dort zentral mit).
# Vorher DB + User anlegen (Setup – Postgres Service-DB, SERVICE=smierx_queue),
# Konfiguration über .env.prod (siehe .env.home.example).
# Die Traefik-Route (queue.smierx.com -> localhost:8010) liegt beim Traefik-Stack
# als dynamic/queue.yml, Traefik läuft im host network.
services:
  app:
    image: ${SMIERX_QUEUE_IMAGE:?SMIERX_QUEUE_IMAGE in .env.prod setzen}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smierx_queue}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env.prod setzen}@postgres:5432/${POSTGRES_DB:-smierx_queue}
      # Die App rechnet mit lokaler Zeit ("heute", Tagesfenster), Container-Default wäre UTC.
      TZ: ${TZ:-Europe/Berlin}
      # Keycloak auf dem Homeserver, Issuer wie ihn der Browser sieht.
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER in .env.prod setzen}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      FRONTEND_KEYCLOAK_URL: ${FRONTEND_KEYCLOAK_URL:?FRONTEND_KEYCLOAK_URL in .env.prod setzen}
      FRONTEND_KEYCLOAK_REALM: ${FRONTEND_KEYCLOAK_REALM:-smierx}
      FRONTEND_KEYCLOAK_CLIENT: ${FRONTEND_KEYCLOAK_CLIENT:-smierx-queue}
    ports:
      # Nur localhost: von außen kommt der Traffic über Traefik (host network).
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    networks:
      - default
      - db-internal
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Image ist public auf GHCR, kein Registry-Login nötig.
    command: --label-enable --cleanup --interval ${WATCHTOWER_INTERVAL:-300}

networks:
  db-internal:
    external: true
