# Homeserver-Deploy nach dem smierx-data-Muster: GHCR-Image + Watchtower.
# Konfiguration über .env.prod (siehe .env.prod.example), Keycloak läuft extern.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smierx_queue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env.prod setzen}
      POSTGRES_DB: ${POSTGRES_DB:-smierx_queue}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smierx_queue}"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Kein Host-Port: die DB ist nur intern für die App erreichbar.

  app:
    image: ${SMIERX_QUEUE_IMAGE:?SMIERX_QUEUE_IMAGE in .env.prod setzen}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smierx_queue}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smierx_queue}
      # Keycloak auf dem Homeserver, Issuer wie ihn der Browser sieht.
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER in .env.prod setzen}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      FRONTEND_KEYCLOAK_URL: ${FRONTEND_KEYCLOAK_URL:?FRONTEND_KEYCLOAK_URL in .env.prod setzen}
      FRONTEND_KEYCLOAK_REALM: ${FRONTEND_KEYCLOAK_REALM:-smierx}
      FRONTEND_KEYCLOAK_CLIENT: ${FRONTEND_KEYCLOAK_CLIENT:-smierx-queue}
    ports:
      - "${APP_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    labels:
      # Nur dieser Container wird von Watchtower automatisch aktualisiert.
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR-Login des Servers, damit Watchtower das private Image ziehen kann.
      - ${HOME}/.docker/config.json:/config.json:ro
    command: --label-enable --cleanup --interval ${WATCHTOWER_INTERVAL:-300}

volumes:
  pgdata:
