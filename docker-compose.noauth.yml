# Single-User-Betrieb ohne Keycloak: die API läuft im Dev-Modus (ein User "dev",
# kein Login), das Frontend startet direkt ohne Redirect. Eigener Postgres-Container.
# Konfiguration über .env.noauth (siehe .env.noauth.example).
# Achtung: ohne Login schützt nur die Erreichbarkeit. Der Port bindet deshalb
# per Default auf 127.0.0.1, bewusst aufmachen über APP_BIND=0.0.0.0.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smierx_queue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env.noauth setzen}
      POSTGRES_DB: ${POSTGRES_DB:-smierx_queue}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smierx_queue}"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Kein Host-Port: die DB ist nur intern für die App erreichbar.

  app:
    image: ${SMIERX_QUEUE_IMAGE:?SMIERX_QUEUE_IMAGE in .env.noauth setzen}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smierx_queue}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smierx_queue}
      # Die App rechnet mit lokaler Zeit ("heute", Tagesfenster), Container-Default wäre UTC.
      TZ: ${TZ:-Europe/Berlin}
      # Bewusst kein OIDC_ISSUER und kein FRONTEND_KEYCLOAK_URL: das ist der Dev-Modus.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    labels:
      # Nur dieser Container wird von Watchtower automatisch aktualisiert.
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Registry-Login des Hosts, falls das Image privat liegt (z.B. eigene Registry).
      - ${HOME}/.docker/config.json:/config.json:ro
    command: --label-enable --cleanup --interval ${WATCHTOWER_INTERVAL:-300}

volumes:
  pgdata:
